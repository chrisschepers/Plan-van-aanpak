name: Deploy naar GitHub Pages

on:
  push:
    branches:
      - claude/ai-plan-aanpak-invuller-ctxrf4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; nieuwe duwt lopende niet omver.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pages configureren (en zo nodig inschakelen)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Site uploaden (repo-root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
